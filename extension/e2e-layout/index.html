<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinta layout harness</title>
    <script>
      // Minimal chrome.* stub — must exist before any module evaluates.
      // Explicit APIs first; any other chrome.x.y resolves to a no-op
      // event/function so unrelated state.svelte.ts code can't throw.
      (function () {
        var noop = function () {};
        var ev = function () {
          return { addListener: noop, removeListener: noop, hasListener: function () { return false; } };
        };
        var pick = function (s, k) {
          if (k == null) return Object.assign({}, s);
          if (typeof k === "string") return k in s ? { [k]: s[k] } : {};
          if (Array.isArray(k)) { var o = {}; k.forEach(function (x) { if (x in s) o[x] = s[x]; }); return o; }
          var r = {}; Object.keys(k).forEach(function (x) { r[x] = x in s ? s[x] : k[x]; }); return r;
        };
        var area = function () {
          var s = {};
          return {
            get: function (k, cb) { var r = pick(s, k); if (cb) cb(r); return Promise.resolve(r); },
            set: function (o, cb) { Object.assign(s, o); if (cb) cb(); return Promise.resolve(); },
            remove: function (k, cb) { [].concat(k).forEach(function (x) { delete s[x]; }); if (cb) cb(); return Promise.resolve(); },
          };
        };
        var fallback = function () {
          // Callable proxy: property access yields another proxy, calls
          // resolve to undefined (sync) — good enough for listeners/badges.
          var f = function () { return Promise.resolve(undefined); };
          return new Proxy(f, {
            get: function (t, p) {
              if (p === "then") return undefined;
              if (p === "addListener" || p === "removeListener") return noop;
              if (p === "hasListener") return function () { return false; };
              if (!(p in t)) t[p] = fallback();
              return t[p];
            },
          });
        };
        var base = {
          storage: { local: area(), session: area(), sync: area(), onChanged: ev() },
          runtime: {
            id: "pinta-e2e-layout",
            // Listeners are kept on window.__runtimeListeners so a script
            // can deliver a page message (overlay.ready) to the panel.
            onMessage: {
              addListener: function (l) { (window.__runtimeListeners = window.__runtimeListeners || []).push(l); },
              removeListener: function (l) { window.__runtimeListeners = (window.__runtimeListeners || []).filter(function (x) { return x !== l; }); },
              hasListener: function () { return false; },
            },
            // Recorded in window.__runtimeSent; `seq` orders them against
            // window.__tabMessages.
            sendMessage: function (msg) {
              (window.__runtimeSent = window.__runtimeSent || []).push({ seq: (window.__seq = (window.__seq || 0) + 1), msg: msg });
              // window.__runtimeReply(msg) (optional) plays the receiver.
              return Promise.resolve(window.__runtimeReply ? window.__runtimeReply(msg) : {});
            },
            getManifest: function () { return { version: "0.9.0" }; },
            // window.__extRoot (set before load) plays the extension origin.
            getURL: function (p) { return (window.__extRoot || "") + p; },
            connect: function () { return { onMessage: ev(), onDisconnect: ev(), postMessage: noop, disconnect: noop }; },
          },
          tabs: {
            // window.__tabs (set before load) is the tab list; every message
            // sent to a tab is recorded in window.__tabMessages.
            query: function () { return Promise.resolve(window.__tabs || []); },
            // The tab an extension page (the Devices canvas) runs in.
            getCurrent: function () { return Promise.resolve(window.__currentTab); },
            // `frameId` is recorded for frame-targeted sends; the optional
            // window.__tabReply(tabId, msg, frameId) plays the page — return
            // a reply, or throw to reject (e.g. a frame that is gone).
            sendMessage: function (tabId, msg, opts) {
              var frameId = opts && typeof opts.frameId === "number" ? opts.frameId : undefined;
              (window.__tabMessages = window.__tabMessages || []).push({ seq: (window.__seq = (window.__seq || 0) + 1), tabId: tabId, msg: msg, frameId: frameId });
              try {
                return Promise.resolve(window.__tabReply ? window.__tabReply(tabId, msg, frameId) : {});
              } catch (e) {
                return Promise.reject(e);
              }
            },
            // Navigations / reloads of a tab, in window.__tabActions.
            update: function (tabId, props) {
              (window.__tabActions = window.__tabActions || []).push({ op: "update", tabId: tabId, props: props });
              return Promise.resolve({ id: tabId });
            },
            reload: function (tabId) {
              (window.__tabActions = window.__tabActions || []).push({ op: "reload", tabId: tabId });
              return Promise.resolve();
            },
            // Kept on window.__tabActivatedListeners so a script can switch tabs.
            onActivated: {
              addListener: function (l) { (window.__tabActivatedListeners = window.__tabActivatedListeners || []).push(l); },
              removeListener: noop,
              hasListener: function () { return false; },
            },
            onUpdated: ev(), onRemoved: ev(),
          },
          windows: { WINDOW_ID_NONE: -1, onFocusChanged: ev() },
        };
        var wrap = function (obj) {
          return new Proxy(obj, {
            get: function (t, p) {
              if (!(p in t)) t[p] = fallback();
              var v = t[p];
              return v && typeof v === "object" && !Array.isArray(v) ? wrap(v) : v;
            },
          });
        };
        window.chrome = wrap(base);
        // No companion here — fail fast instead of scanning localhost ports.
        window.fetch = function () { return Promise.reject(new Error("offline (e2e-layout)")); };      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
